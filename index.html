    .chart-wrap .legend{position:absolute;right:18px;bottom:0;height:19.1%;display:flex;align-items:center;gap:9px;margin:0}.summary-table-wrap{width:100%}.table-note{margin:3px 0 0;color:var(--muted);font-size:.68rem;line-height:1.4}.explanation{padding-top:6px;margin-top:5px;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted);line-height:1.65}.explanation h3{margin:0 0 2px}.explanation ul{margin:0;padding-left:1.2rem}.explanation li{margin:0}.explanation strong{color:var(--text)}.explanation .explanation-warning,.explanation .explanation-warning strong{color:var(--loss)}.explanation-body{display:block}.explanation-confirm{display:block;margin:6px 0 0 auto;border:1px solid var(--gold);background:var(--button);color:var(--button-text);border-radius:7px;padding:3px 14px;font-size:.68rem;font-weight:800;cursor:pointer}.summary-table .share-row th,.summary-table .share-row td{color:var(--gold);font-size:inherit;font-weight:700}

<body class="layout-six">
  <section class="lock-screen" id="lock-screen" aria-label="密語頁">
    <div class="lock-card">
      <div class="lock-stage">
        <div class="lock-clip">
        <img class="lock-hero" src="lock-hero.png" alt="115梯 信義國中籃球隊 比賽紀錄">
        </div>
        <div class="lock-body">
      <form class="lock-form" id="unlock-form">
        <div class="lock-input-wrap">
          <input class="lock-input" id="passphrase" type="password" autocomplete="off" placeholder="請輸入密語" aria-label="請輸入密語">
          <button class="lock-toggle" id="passphrase-toggle" type="button" aria-label="顯示密語">顯示</button>
        </div>
        <p class="lock-error" id="unlock-error" role="alert" hidden>密語不對</p>
        <button class="lock-submit" type="submit">進入</button>
      </form>
      <p class="lock-note">影片為不公開<br>請勿將連結轉貼到隊外</p>
        </div>
      </div>
    </div>
  </section>
  <main class="app" hidden>
    <nav class="mobile-tabs" aria-label="頁面分頁"><button class="mobile-tab active" type="button" data-tab="videos">比賽影片</button><button class="mobile-tab" type="button" data-tab="stats">球員數據</button></nav>
    <div class="content-grid">
      <section class="video-pane" id="video-pane">
        <section class="panel tools" aria-label="搜尋比賽影片"><input class="search" id="search" type="search" placeholder="搜尋日期、對手或盃賽" autocomplete="off"><div class="grade-row"><select id="grade"><option>七年級</option><option>八年級</option><option>九年級</option></select><button class="collapse-toggle" type="button" id="all-cups-toggle" aria-controls="results">全部收折</button></div></section>
        <section id="results" aria-live="polite"></section></section>
      </section>
      <aside class="panel player-panel" id="player-panel" aria-label="球員數據"></aside>
    </div>
    <button class="logout" id="logout" type="button">登出</button>
  </main>
  <script>
    let games=[],cupRanks={},jerseyNumbers={},PLAYER_PHOTOS={}



    const statKeys=["pts","reb","ast","blk","stl","tov"];
    const statLabels=["得分","籃板","助攻","火鍋","抄截","失誤"];
    const gradeNames=["七年級","八年級","九年級"];
    const state={query:"",grade:"七年級",selectedPlayer:"",openCups:new Set(),openDetails:new Set(),chartMode:"single",statKey:"pts",explanationDismissed:false};
    let chartPixelWidth=600,chartResizePass=false;
    const $=id=>document.getElementById(id);
    const esc=value=>String(value).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const firstEventLine=event=>String(event||"").split(String.fromCharCode(10))[0].replaceAll(String.fromCharCode(13),"");
    const cupName=event=>firstEventLine(event).split("_")[0];
    const stageName=event=>firstEventLine(event).split("_").slice(1).join("_")||"";
    const displayDate=date=>{const parts=String(date||"").split("-");return parts.length>=3?parts[1]+"/"+parts[2]:String(date||"")};
    const numberValue=value=>Number.isFinite(Number(value))?Number(value):0;
    const formatOne=value=>String(Math.round(Number(value)*10)/10);
    const rankMark=name=>{const rank=cupRanks[name];return rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":rank===0?"😢":""};
    function dateMatches(game,query){const raw=query.trim().toLowerCase();if(!raw)return false;const parts=raw.replaceAll("/","-").split("-");const dateParts=game.date.split("-");const year=dateParts[0],month=dateParts[1],day=dateParts[2],m=String(Number(month)),d=String(Number(day));if(parts.length===2){if(parts[0].length===4)return parts[0]===year&&(parts[1]===month||parts[1]===m);return(parts[0]===month||parts[0]===m)&&(parts[1]===day||parts[1]===d)}const digits=raw.replaceAll("/","").replaceAll("-","");if(digits.length===4&&digits===year)return true;return digits===year+month||digits===year+m||digits===month+day||digits===m+d}
    function visibleGames(){const q=state.query.trim().toLowerCase();return games.filter(g=>g.grade===state.grade&&(!q||[g.away,cupName(g.event)].some(x=>String(x).toLowerCase().includes(q))||dateMatches(g,q)))}
    function allPlayerNames(){const names=[...new Set(games.flatMap(g=>g.players.map(p=>p.name).filter(Boolean)))];return names.map((name,index)=>({name,index})).sort((a,b)=>{const jerseyA=jerseyNumbers[a.name],jerseyB=jerseyNumbers[b.name];if(jerseyA===undefined&&jerseyB!==undefined)return 1;if(jerseyA!==undefined&&jerseyB===undefined)return -1;if(jerseyA!==undefined&&jerseyB!==undefined)return jerseyA-jerseyB;return a.index-b.index}).map(item=>item.name)}
    const playerLabel=name=>jerseyNumbers[name]===undefined?name:jerseyNumbers[name]+"\u00a0\u00a0"+name;
    function hasPlayedFlags(game){return game.players.some(player=>player.name&&Object.prototype.hasOwnProperty.call(player,"played"))}
     function playerRecords(name,grade){return games.filter(g=>!grade||g.grade===grade).flatMap(g=>g.players.filter(p=>p.name===name&&(!hasPlayedFlags(g)||p.played===true)).map(p=>({game:g,player:p})))}
     function highlightOptions(name){return games.flatMap(g=>{const p=g.players.find(player=>player.name===name);if(!p||!(!hasPlayedFlags(g)||p.played===true))return[];const hit=statKeys.map((key,i)=>{const threshold=key==="pts"?10:5;const value=numberValue(p[key]);return value>=threshold?statLabels[i]+" "+value:""}).filter(Boolean);return hit.length?[{game:g,text:hit.join("、")}]:[]}).sort((a,b)=>b.game.date.localeCompare(a.game.date))}
    function averageRow(name,grade){const records=playerRecords(name,grade);if(!records.length&&!games.some(g=>g.grade===grade&&g.players.some(p=>p.name===name)))return null;return{grade,count:records.length,values:records.length?statKeys.map(key=>records.reduce((sum,item)=>sum+numberValue(item.player[key]),0)/records.length):null}}
    function statCells(values){return values?values.map(value=>"<td>"+formatOne(value)+"</td>").join(""):statKeys.map(()=>'<td class="dash">—</td>').join("")}
    function growthHTML(rows){if(rows.length<2){return'<div class="growth"><span class="growth-title">成長幅度</span><span class="growth-help">至少要有兩個學年才能比較成長狀況</span></div>'}const blocks=[];for(let i=1;i<rows.length;i++){const from=rows[i-1],to=rows[i];const values=to.values.map((value,index)=>{const diff=Math.round((value-from.values[index])*10)/10;const improved=statKeys[index]==="tov"?diff<0:diff>0;const kind=diff===0?"growth-neutral":improved?"growth-positive":"growth-negative";const shown=diff>0?"+"+formatOne(diff):formatOne(diff);return'<span class="growth-value '+kind+'">'+statLabels[index].slice(0,1)+" "+shown+"</span>"}).join("");blocks.push('<div class="growth-block"><span class="growth-period">'+from.grade+" → "+to.grade+'</span><div class="growth-values">'+values+"</div></div>")}return'<div class="growth"><span class="growth-title">成長幅度</span>'+blocks.join("")+"</div>"}
    function teamShareCells(name){const playerTotals=statKeys.map(key=>playerRecords(name).reduce((sum,item)=>sum+numberValue(item.player[key]),0));const teamTotals=statKeys.map(key=>games.reduce((sum,g)=>sum+g.players.reduce((inner,p)=>inner+numberValue(p[key]),0),0));return playerTotals.map((value,index)=>{if(teamTotals[index]===0)return'<td class="dash">—</td>';const share=value/teamTotals[index]*100;const kind=share===0?"zero":statKeys[index]==="tov"?"share-negative":share>0?"share-positive":"share-negative";return'<td class="'+kind+'">'+formatOne(share)+'</td>'}).join("")}
    function yearTableHTML(rows,name){return'<div class="summary-table-wrap"><table class="summary-table"><thead><tr><th>學年</th><th>場次</th>'+statLabels.map(label=>"<th>"+label+"</th>").join("")+'</tr></thead><tbody>'+rows.map((row,index)=>row?'<tr><th>'+row.grade+"</th><td>"+row.count+"</td>"+statCells(row.values)+"</tr>":'<tr><th>'+gradeNames[index]+'</th><td class="dash">—</td>'+statKeys.map(()=>'<td class="dash">—</td>').join("")+"</tr>").join("")+'<tr class="share-row"><th>佔比</th><td></td>'+teamShareCells(name)+'</tr></tbody></table><p class="table-note">佔比：佔全隊比，單位 %</p></div>'}
    function freeThrowHTML(name){const cards=gradeNames.map(grade=>{const records=playerRecords(name,grade);const attempts=records.reduce((sum,item)=>sum+numberValue(item.player.fta),0);const makes=records.reduce((sum,item)=>sum+numberValue(item.player.ftm),0);if(attempts===0)return'<div class="free-throw-card"><span class="free-throw-grade">'+grade+'</span><span class="free-throw-empty">尚無資料</span></div>';const rate=Math.round(makes/attempts*100);const color=['#1f5c8f','#8f2f38'][Number(rate<70)];return'<div class="free-throw-card" style="background:'+color+'"><span class="free-throw-grade">'+grade+'</span><span class="free-throw-rate">'+rate+'%</span><span class="free-throw-count">'+makes+'<small>(進)</small>-'+attempts+'<small>(投)</small></span></div>'}).join('');return'<section class="free-throw-section"><span class="free-throw-title">罰球（累計）</span><div class="free-throw-cards">'+cards+'</div><p class="table-note">命中率 70% 以上為藍底，未達 70% 為紅底</p></section>'}
    function detailHTML(g){const periods=g.periodsHome.map((v,i)=>({i:i,v:v,away:g.periodsAway[i]})).filter(x=>x.v!==-1||x.away!==-1);const labels=periods.map(x=>x.i<4?String(x.i+1):"延"+(x.i-3));const value=v=>v===-1?"—":v;return'<div class="details"><h3>逐節比分</h3><div class="table-wrap"><table class="boxscore"><thead><tr><th></th>'+labels.map(x=>"<th>"+x+"</th>").join("")+'<th>總</th></tr></thead><tbody><tr><th>'+esc(g.home)+'</th>'+periods.map(x=>"<td>"+value(x.v)+"</td>").join("")+'<td class="total">'+g.scoreHome+'</td></tr><tr><th>'+esc(g.away)+'</th>'+periods.map(x=>"<td>"+value(x.away)+"</td>").join("")+'<td class="total">'+g.scoreAway+'</td></tr></tbody></table></div><h3>球員數據</h3><div class="table-wrap"><table class="boxscore player-table"><thead><tr><th>球員</th>'+statLabels.map(label=>"<th>"+label+"</th>").join("")+'</tr></thead><tbody>'+g.players.map(p=>'<tr class="'+(p.name?"":"unknown")+'"><td>'+esc(p.name||"未指定")+"</td>"+statKeys.map(k=>"<td>"+numberValue(p[k])+"</td>").join("")+"</tr>").join("")+"</tbody></table></div></div>"}
    function bindPlayerControls(){const playerSelect=$("player-select");if(playerSelect)playerSelect.addEventListener("change",e=>{state.selectedPlayer=e.target.value;render()});document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>{state.chartMode=button.dataset.mode;render()}));document.querySelectorAll("[data-stat]").forEach(button=>button.addEventListener("click",()=>{state.statKey=button.dataset.stat;render()}));const highlight=$("highlight-select");if(highlight)highlight.addEventListener("change",e=>{if(e.target.value==="")return;const item=highlightOptions(state.selectedPlayer)[Number(e.target.value)];if(item)window.open(item.game.youtube,"_blank","noopener")})}
    function syncCollapseButton(){const button=$("all-cups-toggle");const anyOpen=[...document.querySelectorAll(".cup-header")].some(header=>header.getAttribute("aria-expanded")==="true");button.textContent=anyOpen?"全部收折":"全部展開"}

    function chartHTML(name){
      const records=playerRecords(name);
      const statLabel=statLabels[statKeys.indexOf(state.statKey)];
      const groups=state.chartMode==="single"?[{label:"逐場比較",records:records}]:gradeNames.map(grade=>({label:grade,records:playerRecords(name,grade)}));
      const colors=["var(--loss)","var(--blue)","#ff9b54"];
      const width=chartPixelWidth,height=178,left=34,right=8,top=18,bottom=34,plotW=width-left-right,plotH=height-top-bottom;
      const allValues=groups.flatMap(group=>group.records.map(item=>numberValue(item.player[state.statKey])));
    const hasAnyValues=allValues.length>0;
       const gridCount=8;
       const gridStep=state.statKey==="pts"?5:2;
       const axisMax=state.statKey==="pts"?40:16;
      const xAt=(index,count)=>count<=1?left+plotW/2:left+index/(count-1)*plotW;
      const yAt=value=>top+(axisMax-value)/axisMax*plotH;
      const lines=groups.map((group,index)=>{
         if(group.records.length===1){const item=group.records[0];return'<circle cx="'+xAt(0,1).toFixed(1)+'" cy="'+yAt(numberValue(item.player[state.statKey])).toFixed(1)+'" r="3" fill="'+colors[index%colors.length]+'"/>';}
        if(group.records.length===0)return"";
        const points=group.records.length?group.records.map((item,i)=>xAt(i,group.records.length).toFixed(1)+","+yAt(numberValue(item.player[state.statKey])).toFixed(1)).join(" "):Array.from({length:pointCount},(_,i)=>xAt(i,pointCount).toFixed(1)+","+yAt(0).toFixed(1)).join(" ");
        return'<polyline points="'+points+'" fill="none" stroke="'+colors[index%colors.length]+'" stroke-width="1.17" stroke-linecap="round" stroke-linejoin="round"/>';
      }).join("");
      const gridLines=Array.from({length:gridCount+1},(_,index)=>{
        const value=axisMax-index*gridStep;
        const y=top+plotH*index/gridCount;
        return'<line x1="'+left+'" y1="'+y.toFixed(1)+'" x2="'+(left+plotW)+'" y2="'+y.toFixed(1)+'" stroke="#477466" stroke-width="1" stroke-opacity=".65"/>';
      }).join("");
      const axes='<line x1="'+left+'" y1="'+(top+plotH)+'" x2="'+(left+plotW)+'" y2="'+(top+plotH)+'" stroke="#527c70" stroke-width="1.2"/><line x1="'+left+'" y1="'+top+'" x2="'+left+'" y2="'+(top+plotH)+'" stroke="#527c70" stroke-width="1.2"/>';
      const yLabels='<div class="chart-y-labels">'+Array.from({length:gridCount+1},(_,index)=>'<span style="top:'+(((top+plotH*index/gridCount)/height)*100).toFixed(2)+'%">'+(axisMax-index*gridStep)+'</span>').join("")+'</div>';
      const emptyLabel=hasAnyValues?"":"<text x=\""+(left+plotW/2)+"\" y=\""+(top+plotH/2)+"\" text-anchor=\"middle\" dominant-baseline=\"middle\" fill=\"var(--muted)\" font-size=\"11\">還沒有出賽紀錄</text>";
      const legend=state.chartMode==="year"?'<div class="legend">'+groups.map((group,i)=>'<span class="legend-item"><i class="legend-line" style="background:'+colors[i%colors.length]+'"></i>'+group.label+"</span>").join("")+"</div>":"";
      return'<div class="chart-wrap"><svg class="chart" preserveAspectRatio="none" viewBox="0 0 '+width+" "+height+'" role="img" aria-label="'+statLabel+'走勢">'+gridLines+axes+lines+emptyLabel+"</svg>"+yLabels+legend+"</div>";
    }
    function fitBrandTitle(){
      const brand=document.querySelector('.brand');
      if(!brand)return;
      let title=brand.querySelector('.brand-title');
      if(!title){
        const textNode=[...brand.childNodes].find(node=>node.nodeType===Node.TEXT_NODE&&node.textContent.trim());
        if(!textNode)return;
        title=document.createElement('span');title.className='brand-title';title.textContent=textNode.textContent.trim();textNode.replaceWith(title);
      }
      title.style.fontSize='';
      const logo=brand.querySelector('.brand-logo');
      const app=brand.closest('.app');
      const brandStyle=getComputedStyle(brand);
      const gap=parseFloat(brandStyle.gap)||0;
      const appStyle=app?getComputedStyle(app):null;
      const availableWidth=app?(app.clientWidth-parseFloat(appStyle.paddingLeft)-parseFloat(appStyle.paddingRight)):brand.clientWidth;
      const available=()=>availableWidth-(logo?logo.getBoundingClientRect().width:0)-gap;
      const minimum=14;
      if(logo)logo.style.height='';
      let size=parseFloat(getComputedStyle(title).fontSize)||minimum;
      let passes=0;
      while(title.scrollWidth>available()&&size>minimum&&passes<40){
        size=Math.max(minimum,size*.95);title.style.fontSize=size+'px';passes++;
      }
      let logoHeight=logo?parseFloat(getComputedStyle(logo).height):0;
      while(title.scrollWidth>available()&&logo&&size<=minimum&&logoHeight>48&&passes<80){
        logoHeight=Math.max(48,logoHeight*.9);logo.style.height=logoHeight+'px';passes++;
      }
    }
    function fitSearchInput(){
      const search=$("search");
      if(!search)return;
      search.style.fontSize='';
      const style=getComputedStyle(search);
      const canvas=document.createElement('canvas');
      const context=canvas.getContext('2d');
      if(!context)return;
      context.font=style.font;
      const placeholder=search.getAttribute('placeholder')||'';
      const available=search.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
      const minimum=12;
      let size=parseFloat(style.fontSize)||minimum;
      let passes=0;
      while(context.measureText(placeholder).width>available&&size>minimum&&passes<40){
        size=Math.max(minimum,size*.95);
        search.style.fontSize=size+'px';
        context.font=getComputedStyle(search).font;
        passes++;
      }
    }
    function fitYearTable(){
      const table=document.querySelector('.summary-table');
      const wrap=document.querySelector('.summary-table-wrap');
      if(!table||!wrap)return;
      table.style.fontSize='';
      const minimum=8;
      let size=parseFloat(getComputedStyle(table).fontSize)||minimum;
      let passes=0;
      while(wrap.scrollWidth>wrap.clientWidth&&size>minimum&&passes<40){
        size=Math.max(minimum,size*.95);
        table.style.fontSize=size+'px';
        passes++;
      }
    }
    function fitStatButtons(){
      const buttons=document.querySelectorAll('.layout-six .player-sidebar .stat-button');
      if(!buttons.length)return;
      buttons.forEach(button=>button.style.fontSize='');
      const minimum=7;
      let size=parseFloat(getComputedStyle(buttons[0]).fontSize)||minimum;
      let passes=0;
      const overflows=()=>[...buttons].some(button=>button.scrollWidth>button.clientWidth);
      while(overflows()&&size>minimum&&passes<40){
        size=Math.max(minimum,size*.95);
        buttons.forEach(button=>button.style.fontSize=size+'px');
        passes++;
      }
    }
    function fitFreeThrowCards(){
      document.querySelectorAll('.free-throw-card').forEach(card=>{
        const rate=card.querySelector('.free-throw-rate');
        const count=card.querySelector('.free-throw-count');
        if(rate){
          rate.style.fontSize='29px';
          const minimum=24;
          let size=29;
          let passes=0;
          const textWidth=()=>{const range=document.createRange();range.selectNodeContents(rate);return range.getBoundingClientRect().width};
          while(textWidth()>rate.clientWidth&&size>minimum&&passes<40){
            size=Math.max(minimum,size-1);
            rate.style.fontSize=size+'px';
            passes++;
          }
        }
        if(count){
          count.style.fontSize='';
          const minimum=9;
          let size=12;
          let passes=0;
          const textWidth=()=>{const range=document.createRange();range.selectNodeContents(count);return range.getBoundingClientRect().width};
          while(textWidth()>count.clientWidth&&size>minimum&&passes<40){
            size=Math.max(minimum,size-1);
            count.style.fontSize=size+'px';
            passes++;
          }
        }
      });
    }
     function render(){
      const grouped=new Map();
      visibleGames().forEach(game=>{
        const name=cupName(game.event);
        if(!grouped.has(name))grouped.set(name,[]);
        grouped.get(name).push(game);
      });
      $("player-panel").innerHTML=playerPanelHTML();
      const explanation=$("player-panel").querySelector(".explanation");
      if(explanation){const confirmButton=document.createElement("button");confirmButton.type="button";confirmButton.className="explanation-confirm";confirmButton.textContent="確認";confirmButton.addEventListener("click",()=>{state.explanationDismissed=true;render()});explanation.append(confirmButton)}
      bindPlayerControls();
       const chartArea=$("player-panel").querySelector(".chart-area");
       const chartWidth=chartArea?chartArea.clientWidth:0;
       if(chartWidth>0&&Math.abs(chartWidth-chartPixelWidth)>1&&!chartResizePass){
         chartPixelWidth=chartWidth;
          chartResizePass=true;
          try{render()}finally{chartResizePass=false}
        return;
       }
      if(!grouped.size){
        $("results").innerHTML='<div class="empty">這個年級還沒有比賽紀錄</div>';
        syncCollapseButton();
        return;
      }
      $("results").innerHTML=[...grouped].map(([name,list])=>{
        const auto=state.query.trim()!=="";
        const isOpen=auto||state.openCups.has(name);
        const gamesHTML=list.map(game=>{
          const id=game.session;
          const won=game.scoreHome>game.scoreAway;
          return'<article class="game"><div class="game-top"><span class="date">'+displayDate(game.date)+'</span><span class="vs">vs</span><span class="opponent">'+esc(game.away)+'</span><span class="score"><span class="'+(won?"win":"loss")+'">'+game.scoreHome+'</span> <span class="score-separator">:</span> <span class="'+(won?"loss":"win")+'">'+game.scoreAway+'</span></span></div><div class="game-bottom"><span>'+esc(stageName(game.event))+'</span><span class="game-actions"><button class="video-button" type="button" data-youtube="'+esc(game.youtube)+'">影片連結</button><button class="data-button" type="button" data-detail="'+id+'" aria-expanded="'+state.openDetails.has(id)+'">'+(state.openDetails.has(id)?"數據收起":"數據展開")+'</button></span></div>'+(state.openDetails.has(id)?detailHTML(game):"")+"</article>";
        }).join("");
        return'<section class="panel cup"><button class="cup-header" type="button" data-cup="'+esc(name)+'" aria-expanded="'+isOpen+'"><span class="chevron">'+(isOpen?"▼":"▶")+'</span><span class="cup-name">'+esc(name)+'</span><span class="rank">'+rankMark(name)+'</span><span class="count">'+list.length+' 場</span></button><div class="games '+(isOpen?"":"hidden")+'">'+gamesHTML+"</div></section>";
      }).join("");
      syncCollapseButton();
    }
    function markZeroCells(){document.querySelectorAll('.summary-table td:not(.dash),.player-table td:not(:first-child)').forEach(cell=>{const value=Number.parseFloat(cell.textContent);if(Number.isFinite(value)&&value===0)cell.classList.add('zero')})}
    const renderWithZeroCells=render;render=()=>{renderWithZeroCells();markZeroCells();fitYearTable();fitStatButtons();fitFreeThrowCards()};
     let resizeTimer;
     window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{render();fitBrandTitle();fitSearchInput();fitYearTable();fitStatButtons();fitFreeThrowCards()},120)});
    function boot(){render();fitBrandTitle();fitSearchInput();fitYearTable();fitStatButtons()}
    fitFreeThrowCards();
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>fitFreeThrowCards())}
  </script>


  <script>
    (()=>{
      const lockScreen=document.getElementById("lock-screen");
      const form=document.getElementById("unlock-form");
      const passphrase=document.getElementById("passphrase");
      const passphraseToggle=document.getElementById("passphrase-toggle");
      const error=document.getElementById("unlock-error");
      const submit=document.querySelector(".lock-submit");
      const logout=document.getElementById("logout");
      const app=document.querySelector(".app");
      const storageKey="xinyi-basketball-video-hub-pass";
      let busy=false;
      const decodeBase64=value=>Uint8Array.from(atob(value.trim()),char=>char.charCodeAt(0));
      async function decryptData(pass){
        let response;
        try{response=await fetch("data.enc?v=20260913_151612192",{cache:"no-store"});}catch(err){throw Object.assign(new Error("data.enc 讀取失敗"),{code:"data"});}
        if(!response.ok)throw Object.assign(new Error("data.enc 讀取失敗"),{code:"data"});
        const blob=decodeBase64(await response.text());
        if(blob.length<45)throw new Error("資料檔格式不對");
        const salt=blob.slice(0,16);
        const iv=blob.slice(16,28);
        const ciphertext=blob.slice(28);
        const material=await window.crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
        const key=await window.crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
        const plain=await window.crypto.subtle.decrypt({name:"AES-GCM",iv,tagLength:128},key,ciphertext);
        return JSON.parse(new TextDecoder().decode(plain));
      }
      async function enter(pass,showError){
        if(busy)return;
        busy=true;
        submit.disabled=true;
        passphrase.disabled=true;
        submit.textContent="解密中…";
        error.hidden=true;
        let data;
        try{
          data=await decryptData(pass);
        }catch(err){
          if(showError){error.textContent="密語不對";if(err.code==="data")error.textContent="資料檔讀取失敗，請重新整理";error.hidden=false;passphrase.focus();}
          err.unlockFailure=true;
          throw err;
        }finally{
          busy=false;
          submit.disabled=false;
          passphrase.disabled=false;
          submit.textContent="進入";
        }
        games=data.games;cupRanks=data.cupRanks;jerseyNumbers=data.jerseyNumbers;PLAYER_PHOTOS=data.playerPhotos;
        app.hidden=false;lockScreen.hidden=true;
        localStorage.setItem(storageKey,pass);
        boot();
      }
      if(!window.isSecureContext||!window.crypto||!window.crypto.subtle){error.textContent="這個瀏覽器無法解密，請改用其他瀏覽器開啟";error.hidden=false;submit.disabled=true;return;}
      passphraseToggle.addEventListener("click",()=>{const start=passphrase.selectionStart;const end=passphrase.selectionEnd;if(passphrase.type==="text"){passphrase.type="password";passphraseToggle.textContent="顯示";passphraseToggle.setAttribute("aria-label","顯示密語");}else{passphrase.type="text";passphraseToggle.textContent="隱藏";passphraseToggle.setAttribute("aria-label","隱藏密語");}passphrase.focus();if(start!==null&&end!==null)passphrase.setSelectionRange(start,end);});
      form.addEventListener("submit",event=>{event.preventDefault();enter(passphrase.value,true).catch(()=>{});});
      logout.addEventListener("click",()=>{localStorage.removeItem(storageKey);app.hidden=true;lockScreen.hidden=false;passphrase.value="";error.hidden=true;passphrase.focus();});
      const saved=localStorage.getItem(storageKey);
      if(saved)enter(saved,false).catch(err=>{if(err.unlockFailure){localStorage.removeItem(storageKey);error.textContent="已儲存的密語失效，請重新輸入";error.hidden=false;passphrase.focus();}});else passphrase.focus();
    })();
  </script>
